<!DOCTYPE html>
<html lang="vi" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniimo Egg Map</title>
    <link rel="icon" type="image/png" href="/404/logo.png" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        yt: {
                            bg: '#0f0f0f',
                            card: '#18181b',
                            border: '#27272a',
                            accent: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar matching dark style */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }

        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        body {
            background-color: #0f0f0f;
            color: #f4f4f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(6px);
        }

        .mini-border {
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.15);
        }

        .mini-border:hover {
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.4);
        }

        /* Pan & Zoom interactive container style */
        .zoom-viewport {
            overflow: hidden;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .zoom-viewport:active {
            cursor: grabbing;
        }

        #modalImage {
            transform-origin: 0 0;
            will-change: transform;
        }
    </style>
</head>

<body class="bg-[#0f0f0f] text-zinc-100 min-h-screen p-3 md:p-6 flex flex-col selection:bg-amber-500/30">

    <!-- Top Floating Header Action bar -->
    <div
        class="max-w-[1800px] mx-auto w-full flex items-center justify-between mb-4 md:mb-6 pb-2 border-b border-[#27272a]/60">
        <div class="flex items-center space-x-3">
            <div
                class="bg-gradient-to-tr from-amber-600 to-orange-500 text-white p-2 rounded-xl flex items-center justify-center font-bold shadow-lg shadow-amber-950/30">
                <i class="fa-solid fa-map-location-dot text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    Aniimo <span class="text-amber-500">Map Checker</span>
                </h1>
                <p class="text-xs text-zinc-400">Danh sách Layouts bản đồ Aniimo</p>
            </div>
        </div>

        <!-- Add Layout Button -->
        <button id="addMapBtn"
            class="bg-amber-600 hover:bg-amber-500 active:scale-95 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center space-x-2 shadow-lg shadow-amber-950/40 border border-amber-400/20">
            <i class="fa-solid fa-plus text-xs"></i>
            <span>Thêm Layout</span>
        </button>
    </div>

    <!-- Main Grid Container -->
    <main class="max-w-[1800px] mx-auto w-full flex-1">
        <div id="mapsContainer"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            <!-- Dynamic Map Cards render here -->
        </div>
    </main>

    <!-- Zoom Modal - Tự điều chỉnh kích thước linh hoạt theo màn hình -->
    <div id="imageModal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-0 md:p-4">
        <div
            class="relative bg-[#18181b] border border-[#27272a] md:rounded-2xl w-full md:max-w-6xl h-full md:h-[92vh] flex flex-col shadow-2xl overflow-hidden transition-all">

            <!-- Modal Header -->
            <div
                class="flex items-center justify-between px-3.5 py-2 border-b border-[#27272a] bg-[#121214] shrink-0 z-20 gap-2">
                <div class="flex items-center space-x-2 min-w-0">
                    <span id="modalMapTag"
                        class="bg-amber-500/20 text-amber-400 text-[11px] px-2 py-0.5 rounded-full font-medium border border-amber-500/30 truncate shrink-0"></span>
                    <h3 id="modalTitle" class="text-sm font-bold text-white truncate">Chi tiết bản đồ</h3>
                </div>

                <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                    <!-- Thanh Zoom -->
                    <div
                        class="bg-[#18181b] border border-[#27272a] rounded-lg px-2 py-0.5 flex items-center space-x-1 shadow-inner">
                        <button id="zoomOutBtn" title="Thu nhỏ (-)"
                            class="text-zinc-400 hover:text-amber-400 p-1 rounded hover:bg-[#27272a] transition text-xs">
                            <i class="fa-solid fa-minus"></i>
                        </button>

                        <span id="zoomPercent"
                            class="text-amber-400 font-mono text-xs font-bold w-9 text-center select-none">100%</span>

                        <button id="zoomInBtn" title="Phóng to (+)"
                            class="text-zinc-400 hover:text-amber-400 p-1 rounded hover:bg-[#27272a] transition text-xs">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                        <div class="w-px h-3 bg-[#27272a]"></div>

                        <button id="zoomResetBtn" title="Đặt lại 100%"
                            class="text-[10px] text-zinc-400 hover:text-white px-1 py-0.5 rounded hover:bg-[#27272a] transition font-medium">
                            Reset
                        </button>
                    </div>

                    <div class="w-px h-4 bg-[#27272a] hidden sm:block"></div>

                    <button id="modalDownload" title="Tải ảnh"
                        class="text-zinc-400 hover:text-white p-1.5 rounded-lg hover:bg-[#27272a] transition text-sm">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button id="closeModal"
                        class="text-zinc-400 hover:text-white p-1.5 rounded-lg hover:bg-[#27272a] transition text-base">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Modal Interactive Zoom Viewport Container -->
            <div id="zoomViewport"
                class="zoom-viewport flex-1 relative flex items-center justify-center bg-[#09090b] overflow-hidden w-full h-full p-0">
                <img id="modalImage" src="" alt="Preview"
                    class="max-h-full max-w-full object-contain pointer-events-none select-none">
            </div>
        </div>
    </div>

    <!-- Add New Layout Modal Form -->
    <div id="addMapModal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
        <div
            class="bg-[#18181b] border border-[#27272a] rounded-2xl max-w-md w-full flex flex-col shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between px-5 py-3.5 border-b border-[#27272a] bg-[#121214]">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-map text-amber-500"></i> Thêm Layout Mới
                </h3>
                <button id="closeAddModal"
                    class="text-zinc-400 hover:text-white p-1.5 rounded-lg hover:bg-[#27272a] transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="addMapForm" class="p-5 space-y-3.5 text-xs">
                <div>
                    <label class="block font-semibold text-zinc-300 mb-1">Tên Layout *</label>
                    <input type="text" id="newMapName" required placeholder="VD: Layout X"
                        class="w-full bg-[#0f0f11] border border-[#27272a] rounded-lg px-3 py-2 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block font-semibold text-zinc-300 mb-1">Mô tả Cổng (Entrance Description) *</label>
                    <input type="text" id="newEntranceDesc" required placeholder="VD: #"
                        class="w-full bg-[#0f0f11] border border-[#27272a] rounded-lg px-3 py-2 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block font-semibold text-zinc-300 mb-1">URL Ảnh Full Map *</label>
                    <input type="url" id="newFullImg" required placeholder="https://..."
                        class="w-full bg-[#0f0f11] border border-[#27272a] rounded-lg px-3 py-2 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block font-semibold text-zinc-300 mb-1">URL Ảnh Mini Cổng *</label>
                    <input type="url" id="newEntranceImg" required placeholder="https://..."
                        class="w-full bg-[#0f0f11] border border-[#27272a] rounded-lg px-3 py-2 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500">
                </div>
                <div class="pt-3 flex justify-end space-x-2">
                    <button type="button" id="cancelAddBtn"
                        class="bg-[#27272a] hover:bg-[#3f3f46] text-white px-4 py-2 rounded-xl text-xs font-medium transition">Hủy</button>
                    <button type="submit"
                        class="bg-amber-600 hover:bg-amber-500 text-white px-5 py-2 rounded-xl text-xs font-semibold transition">Thêm
                        Mới</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        const DEFAULT_MAPS = [
            {
                id: "default_1",
                isCustom: false,
                name: "Layout 34",
                entranceDesc: "#",
                entranceImg: "./img/1.1-L34.png",
                fullImg: "./img/1.1-L34F.png"
            },
            {
                id: "default_2",
                isCustom: false,
                name: "Layout 37",
                entranceDesc: "#",
                entranceImg: "./img/1.2-L37.png",
                fullImg: "./img/1.2-L37F.png"
            },
            {
                id: "default_3",
                isCustom: false,
                name: "Layout 61",
                entranceDesc: "#",
                entranceImg: "./img/1.3-L61.png",
                fullImg: "./img/1.3-L61F.png"
            },
            {
                id: "default_4",
                isCustom: false,
                name: "Layout 40",
                entranceDesc: "#",
                entranceImg: "./img/2.1-L40.png",
                fullImg: "./img/2.1-L40F.png"
            },
            {
                id: "default_5",
                isCustom: false,
                name: "Layout 35",
                entranceDesc: "#",
                entranceImg: "./img/3.1-L35.png",
                fullImg: "./img/3.1-L35F.png"
            },
            {
                id: "default_6",
                isCustom: false,
                name: "Layout 31",
                entranceDesc: "#",
                entranceImg: "./img/3.2-L31.png",
                fullImg: "./img/3.2-L31F.png"
            },
            {
                id: "default_7",
                isCustom: false,
                name: "Layout 38",
                entranceDesc: "#",
                entranceImg: "./img/3.3-L38.png",
                fullImg: "./img/3.3-L38F.png"
            },
            {
                id: "default_8",
                isCustom: false,
                name: "Layout 39",
                entranceDesc: "#",
                entranceImg: "./img/4.1-L39.png",
                fullImg: "./img/4.1-L39F.png"
            },
            {
                id: "default_9",
                isCustom: false,
                name: "Layout 36",
                entranceDesc: "#",
                entranceImg: "./img/5.1-L36.png",
                fullImg: "./img/5.1-L36F.png"
            },
            {
                id: "default_10",
                isCustom: false,
                name: "Layout 33",
                entranceDesc: "#",
                entranceImg: "./img/5.2-L33.png",
                fullImg: "./img/5.2-L33F.png"
            },
            {
                id: "default_11",
                isCustom: false,
                name: "Layout 32",
                entranceDesc: "#",
                entranceImg: "./img/6.1-L32.png",
                fullImg: "./img/6.1-L32F.png"
            },
            {
                id: "default_12",
                isCustom: false,
                name: "Layout 62",
                entranceDesc: "#",
                entranceImg: "./img/6.2-L62.png",
                fullImg: "./img/6.2-L62F.png"
            }
        ];

        class AniimoMapApp {
            constructor() {
                this.customMaps = this.loadCustomMaps();
                this.initZoomState();
                this.initDOM();
                this.bindEvents();
                this.bindZoomEvents();
                this.render();
            }

            initZoomState() {
                this.scale = 1;
                this.panning = false;
                this.pointX = 0;
                this.pointY = 0;
                this.startX = 0;
                this.startY = 0;
            }

            loadCustomMaps() {
                try {
                    const saved = localStorage.getItem('aniimo_custom_maps');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            }

            saveCustomMaps() {
                localStorage.setItem('aniimo_custom_maps', JSON.stringify(this.customMaps));
            }

            getCombinedMaps() {
                return [...DEFAULT_MAPS, ...this.customMaps];
            }

            initDOM() {
                this.mapsContainer = document.getElementById('mapsContainer');
                this.imageModal = document.getElementById('imageModal');
                this.modalImage = document.getElementById('modalImage');
                this.modalTitle = document.getElementById('modalTitle');
                this.modalMapTag = document.getElementById('modalMapTag');
                this.closeModal = document.getElementById('closeModal');
                this.modalDownload = document.getElementById('modalDownload');

                this.zoomViewport = document.getElementById('zoomViewport');
                this.zoomInBtn = document.getElementById('zoomInBtn');
                this.zoomOutBtn = document.getElementById('zoomOutBtn');
                this.zoomResetBtn = document.getElementById('zoomResetBtn');
                this.zoomPercent = document.getElementById('zoomPercent');

                this.addMapBtn = document.getElementById('addMapBtn');
                this.addMapModal = document.getElementById('addMapModal');
                this.closeAddModal = document.getElementById('closeAddModal');
                this.cancelAddBtn = document.getElementById('cancelAddBtn');
                this.addMapForm = document.getElementById('addMapForm');
            }

            bindEvents() {
                this.closeModal.addEventListener('click', () => this.closeZoomModal());
                this.imageModal.addEventListener('click', (e) => {
                    if (e.target === this.imageModal) this.closeZoomModal();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeZoomModal();
                        this.addMapModal.classList.add('hidden');
                    }
                });

                this.modalDownload.addEventListener('click', () => {
                    if (!this.modalImage.src) return;
                    const a = document.createElement('a');
                    a.href = this.modalImage.src;
                    a.download = 'aniimo-map.jpg';
                    a.target = '_blank';
                    a.click();
                });

                this.addMapBtn.addEventListener('click', () => this.addMapModal.classList.remove('hidden'));
                this.closeAddModal.addEventListener('click', () => this.addMapModal.classList.add('hidden'));
                this.cancelAddBtn.addEventListener('click', () => this.addMapModal.classList.add('hidden'));

                this.addMapForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleAddLayout();
                });
            }

            bindZoomEvents() {
                this.zoomViewport.addEventListener('wheel', (e) => {
                    e.preventDefault();

                    const rect = this.modalImage.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    let newScale;
                    if (e.deltaY < 0) {
                        newScale = Math.min(this.scale * 1.2, 8);
                    } else {
                        newScale = Math.max(this.scale / 1.2, 0.5);
                    }

                    if (newScale === this.scale) return;

                    const scaleRatio = newScale / this.scale;

                    this.pointX -= mouseX * (scaleRatio - 1);
                    this.pointY -= mouseY * (scaleRatio - 1);
                    this.scale = newScale;

                    this.updateTransform();
                }, { passive: false });

                this.zoomViewport.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    this.startX = e.clientX - this.pointX;
                    this.startY = e.clientY - this.pointY;
                    this.panning = true;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.panning) return;
                    e.preventDefault();
                    this.pointX = e.clientX - this.startX;
                    this.pointY = e.clientY - this.startY;
                    this.updateTransform();
                });

                window.addEventListener('mouseup', () => {
                    this.panning = false;
                });

                this.zoomInBtn.addEventListener('click', () => {
                    const rect = this.zoomViewport.getBoundingClientRect();
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const newScale = Math.min(this.scale * 1.3, 8);
                    const scaleRatio = newScale / this.scale;

                    this.pointX -= centerX * (scaleRatio - 1);
                    this.pointY -= centerY * (scaleRatio - 1);
                    this.scale = newScale;
                    this.updateTransform();
                });

                this.zoomOutBtn.addEventListener('click', () => {
                    const rect = this.zoomViewport.getBoundingClientRect();
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const newScale = Math.max(this.scale / 1.3, 0.5);
                    const scaleRatio = newScale / this.scale;

                    this.pointX -= centerX * (scaleRatio - 1);
                    this.pointY -= centerY * (scaleRatio - 1);
                    this.scale = newScale;
                    this.updateTransform();
                });

                this.zoomResetBtn.addEventListener('click', () => {
                    this.resetZoom();
                });
            }

            updateTransform() {
                this.modalImage.style.transform = `translate3d(${this.pointX}px, ${this.pointY}px, 0px) scale(${this.scale})`;
                this.zoomPercent.textContent = `${Math.round(this.scale * 100)}%`;
            }

            resetZoom() {
                this.scale = 1;
                this.pointX = 0;
                this.pointY = 0;
                this.modalImage.style.transform = `translate3d(0px, 0px, 0px) scale(1)`;
                this.zoomPercent.textContent = `100%`;
            }

            handleAddLayout() {
                const name = document.getElementById('newMapName').value.trim();
                const entranceDesc = document.getElementById('newEntranceDesc').value.trim();
                const fullImg = document.getElementById('newFullImg').value.trim();
                const entranceImg = document.getElementById('newEntranceImg').value.trim();

                const newLayout = {
                    id: 'custom_' + Date.now(),
                    isCustom: true,
                    name,
                    entranceDesc,
                    entranceImg,
                    fullImg
                };

                this.customMaps.unshift(newLayout);
                this.saveCustomMaps();
                this.render();

                this.addMapForm.reset();
                this.addMapModal.classList.add('hidden');
            }

            deleteCustomLayout(id) {
                this.customMaps = this.customMaps.filter(m => m.id !== id);
                this.saveCustomMaps();
                this.render();
            }

            openZoomModal(imgSrc, title, desc) {
                this.modalImage.src = imgSrc;
                this.modalTitle.textContent = title;
                this.modalMapTag.textContent = desc;
                this.resetZoom();
                this.imageModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            closeZoomModal() {
                this.imageModal.classList.add('hidden');
                document.body.style.overflow = 'auto';
                this.modalImage.src = '';
                this.resetZoom();
            }

            render() {
                this.mapsContainer.innerHTML = '';
                const allMaps = this.getCombinedMaps();

                allMaps.forEach(map => {
                    const card = document.createElement('div');
                    card.className = "bg-[#18181b] border border-[#27272a] rounded-xl overflow-hidden hover:border-amber-500/60 transition duration-200 flex flex-col justify-between shadow-lg group hover:shadow-amber-950/20 relative";

                    card.innerHTML = `
                        ${map.isCustom ? `
                            <button title="Xóa Layout này" class="delete-btn absolute top-2 right-2 z-20 bg-black/70 hover:bg-rose-600 text-zinc-300 hover:text-white w-7 h-7 rounded-full flex items-center justify-center transition border border-white/10 text-xs">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        ` : ''}

                        <!-- TOP FULL MAP IMAGE -->
                        <div class="relative w-full h-48 sm:h-52 bg-[#09090b] flex items-center justify-center p-2 border-b border-[#27272a] cursor-pointer overflow-hidden group/top">
                            <img src="${map.fullImg}" alt="${map.name}" onerror="this.src='https://placehold.co/600x450/1e1e1e/888888?text=Full+Map'" class="w-full h-full object-contain transition duration-300 group-hover/top:scale-105">
                            
                            <div class="absolute top-2 left-2 bg-black/70 backdrop-blur-md px-2 py-0.5 rounded text-[10px] text-zinc-300 font-mono border border-white/10 opacity-80">
                                FULL MAP
                            </div>

                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover/top:opacity-100 transition duration-200 flex items-center justify-center">
                                <span class="bg-black/80 text-white text-xs px-3 py-1.5 rounded-full font-medium border border-white/20 shadow flex items-center">
                                    <i class="fa-solid fa-expand text-amber-400 mr-1.5"></i> Xem toàn cảnh
                                </span>
                            </div>
                        </div>

                        <!-- BOTTOM INFO & RECTANGULAR MINI MAP -->
                        <div class="p-3 bg-[#18181b] flex items-stretch justify-between min-h-[105px] gap-2">
                            <!-- Left Details -->
                            <div class="flex flex-col justify-between pr-1 z-10 flex-1 min-w-0">
                                <div>
                                    <h2 class="text-base font-extrabold text-white tracking-wide group-hover:text-amber-400 transition truncate">${map.name}</h2>
                                    <p class="text-xs text-zinc-400 font-medium line-clamp-2 mt-0.5" title="${map.entranceDesc}">${map.entranceDesc}</p>
                                </div>
                            </div>

                            <!-- Right Rectangular Mini Entrance Map -->
                            <div class="mini-trigger shrink-0 cursor-pointer group/mini z-10 self-center" title="Click để phóng to Hướng Cổng">
                                <div class="w-24 h-20 rounded-xl border-2 border-amber-500/80 bg-[#0c0c0e] overflow-hidden p-1 mini-border transition-all duration-300 group-hover/mini:border-amber-400 group-hover/mini:scale-105 flex items-center justify-center relative">
                                    <img src="${map.entranceImg}" alt="Mini" onerror="this.src='https://placehold.co/200x200/1e1e1e/888888?text=Mini'" class="w-full h-full object-contain rounded-lg">
                                    
                                    <div class="absolute top-1 right-1 bg-black/80 text-[8px] text-amber-400 px-1 py-0.5 rounded font-mono border border-amber-500/30">
                                        MINI
                                    </div>
                                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover/mini:opacity-100 transition flex items-center justify-center rounded-lg">
                                        <i class="fa-solid fa-magnifying-glass-plus text-xs text-amber-400"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    const topImage = card.querySelector('.group\\/top');
                    topImage.addEventListener('click', () => {
                        this.openZoomModal(map.fullImg, map.name, map.entranceDesc);
                    });

                    const miniTrigger = card.querySelector('.mini-trigger');
                    miniTrigger.addEventListener('click', () => {
                        this.openZoomModal(map.entranceImg, map.name + ' - Entrance', map.entranceDesc);
                    });

                    if (map.isCustom) {
                        const deleteBtn = card.querySelector('.delete-btn');
                        deleteBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.deleteCustomLayout(map.id);
                        });
                    }

                    this.mapsContainer.appendChild(card);
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.aniimoApp = new AniimoMapApp();
        });
    </script>
